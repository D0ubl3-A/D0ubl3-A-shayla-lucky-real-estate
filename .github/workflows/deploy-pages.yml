name: Deploy Shayla Lucky site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare GitHub Pages build
        shell: bash
        run: |
          rm -rf _site
          cp -R public _site
          touch _site/.nojekyll
          python - <<'PY'
          from pathlib import Path

          root = Path('_site')
          repo = 'D0ubl3-A-shayla-lucky-real-estate'
          pages_base = f'https://d0ubl3-a.github.io/{repo}'

          replacements = [
              ('https://shaylalucky.com/assets/shayla-lucky.jpg', pages_base + '/assets/shayla-lucky.svg'),
              ('https://shaylalucky.com/assets/', pages_base + '/assets/'),
              ('https://shaylalucky.com/', pages_base + '/'),
              ('/assets/shayla-lucky.jpg', 'assets/shayla-lucky.svg'),
              ('href="/styles.css"', 'href="styles.css"'),
              ('src="/app.js"', 'src="app.js"'),
              ('src="/admin.js"', 'src="admin.js"'),
              ('src="/assets/', 'src="assets/'),
              ('href="/buy"', 'href="buy.html"'),
              ('href="/sell"', 'href="sell.html"'),
              ('href="/invest"', 'href="invest.html"'),
              ('href="/metro-detroit-real-estate"', 'href="metro-detroit-real-estate.html"'),
              ('href="/detroit-investment-property"', 'href="detroit-investment-property.html"'),
              ('href="/birmingham-mi-real-estate"', 'href="birmingham-mi-real-estate.html"'),
              ('href="/about"', 'href="about.html"'),
              ('href="/privacy"', 'href="privacy.html"'),
              ('href="/"', 'href="index.html"'),
          ]

          for p in root.glob('*.html'):
              text = p.read_text(encoding='utf-8')
              for old, new in replacements:
                  text = text.replace(old, new)
              p.write_text(text, encoding='utf-8')

          # GitHub Pages cannot run the Express/SQLite API. Keep the static site usable
          # and make lead-form failure explicit instead of silently breaking.
          app = root / 'app.js'
          if app.exists():
              js = app.read_text(encoding='utf-8')
              js = js.replace("const response = await fetch('/api/leads', {", "if (location.hostname.endsWith('github.io')) { throw new Error('This preview is hosted on GitHub Pages. Lead submission will be enabled on the production host.'); }\n        const response = await fetch('/api/leads', {")
              app.write_text(js, encoding='utf-8')
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
